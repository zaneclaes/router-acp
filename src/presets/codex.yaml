# Built-in defaults for a `codex` agent (codex-acp). An agent entry inherits
# every key it does not set; mappings merge, lists and scalars replace.
command:
  type: stdio
  command: codex-acp
model_selection:
  type: config-option
budget_prompts_5h: 400
usage_source:
  type: codex-rollout
auth_probe:
  command: codex
  args:
  - login
  - status
llm_proxy:
  protocol: openai
  base_url_env: OPENAI_BASE_URL
  upstream_base_url: https://chatgpt.com/backend-api/codex
  codex_chatgpt_provider: true
mode_map:
  auto: agent-full-access
  approve: agent
  chat: read-only
  preclass: read-only
lineage: codex
models:
- id: gpt-5.6-luna
  display_name: GPT Luna
  cost_rank: 2
  pricing:
    input_per_mtok: 1.0
    output_per_mtok: 6.0
- id: gpt-5.6-terra
  display_name: GPT Terra
  cost_rank: 4
  pricing:
    input_per_mtok: 2.5
    output_per_mtok: 15.0
- id: gpt-5.6-sol
  display_name: GPT Sol
  cost_rank: 5
  pricing:
    input_per_mtok: 5.0
    output_per_mtok: 30.0
- id: gpt-6-luna
  display_name: GPT-6 Luna
  cost_rank: 2
  pricing:
    input_per_mtok: 0.1
    output_per_mtok: 0.5
    cache_read_per_mtok: 0.01
    cache_write_per_mtok: 0.125
- id: gpt-6-sol
  display_name: GPT-6 Sol
  cost_rank: 5
  pricing:
    input_per_mtok: 2.0
    output_per_mtok: 10.0
    cache_read_per_mtok: 0.2
    cache_write_per_mtok: 2.5
- id: gpt-6.1-sol
  display_name: GPT-6.1 Sol
  cost_rank: 5
  pricing:
    input_per_mtok: 2.0
    output_per_mtok: 10.0
    cache_read_per_mtok: 0.1
    cache_write_per_mtok: 2.5
# GPT-6 Astra (2026-09-03): OpenAI's flagship above the Sol family. $10/$50,
# standard 0.1x cache read / 1.25x write, 1.05M context, native xhigh/max.
# Scored from its own calibrated evidence (`*gpt-6-astra*` in
# data/model-policy.yaml and data/scores.yaml); tests/model_contract.rs and
# `scripts/update_models.py --validate-only` fail if any of that goes missing.
- id: gpt-6-astra
  display_name: GPT-6 Astra
  cost_rank: 5
  pricing:
    input_per_mtok: 10.0
    output_per_mtok: 50.0
    cache_read_per_mtok: 1.0
    cache_write_per_mtok: 12.5
