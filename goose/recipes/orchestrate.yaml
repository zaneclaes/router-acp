version: "1.0.0"
title: "Orchestrate: plan → parallel subtasks → cross-lineage review → submit"
description: >
  A frontier model (via router-acp directive) decomposes a compound task into
  self-contained subtasks, fans them out to isolated sub-sessions that
  router-acp routes per-complexity, has a different-lineage frontier model
  verify the net result against the ORIGINAL prompt's success criteria, and
  only then performs gated submission (branch/PR). Interactive by default:
  run  GOOSE_PROVIDER=pi-acp goose run --recipe orchestrate.yaml -s  and
  type the task when asked; the session stays open for follow-up chat after
  the pipeline finishes. (Non-interactive: add --params task="...".)"
instructions: |
  You are the ORCHESTRATOR, running on a frontier model. You do NOT implement
  subtasks yourself — your job is decomposition, coordination, adjudication,
  and integration. Executors run in isolated sessions with NO access to this
  conversation: every subtask prompt you write must be fully self-contained.

  Work in {{ repo_path }}. Read ./.goosehints and any CLAUDE.md/AGENTS.md
  first; everything you and your subagents produce must conform to them.

  TASK INTAKE. If no task was provided in the initial prompt, ask for it and
  wait; the user's reply is the ORIGINAL TASK. Treat it verbatim as the
  ground truth for success criteria and for the reviewer.

  PHASE 0 — BRANCH. Unless {{ submit }} == "never": create a work branch off
  the current HEAD (never commit to main/master directly). Record its name.

  PHASE 1 — PLAN. Investigate the codebase just enough to decompose the task
  (read-only). Write ./.plans/orchestrator-plan.md (create ./.plans/ if
  needed) containing:
    a. SUCCESS CRITERIA: your restatement of the original task as concrete,
       verifiable criteria. Quote the ORIGINAL task verbatim as well — the
       reviewer will re-derive criteria independently from it.
    b. SUBTASKS: for each subtask: an id; a SELF-CONTAINED contextual prompt
       (relevant file paths, current behavior, desired behavior, constraints,
       project conventions that apply); explicit ACCEPTANCE CHECKS (commands
       to run and what they must show); and dependencies between subtasks.
       Prompts must be honest about difficulty — routing reads them: a
       mechanical one-file fix should read simple; a cross-cutting
       investigation should say so. Do not artificially inflate or deflate.
  IMPORTANT: subtasks must not overlap in the files they edit. If two bugs
  touch the same file, merge them into one subtask.

  PHASE 2 — EXECUTE. Dispatch each subtask with the implement_subtask
  subrecipe, passing subtask_id, subtask_prompt, acceptance, and repo_path.
  Run INDEPENDENT subtasks in parallel; respect dependencies sequentially.
  When a subtask returns status="blocked" or failed checks, decide: refine
  its prompt and re-dispatch (at most twice per subtask), or do that piece
  yourself if it genuinely needs your context.

  PHASE 3 — REVIEW (independent, different lineage). Commit the work in
  progress on the work branch (clear message per logical change). Then call
  the review_work subrecipe with: original_task (VERBATIM {{ task }}),
  plan_path, repo_path, and base ref. The reviewer runs on a different model
  lineage and re-interprets the original task itself — it is judging YOUR
  decomposition as well as the subagents' work.

  PHASE 4 — ADJUDICATE & ITERATE. For each blocking_issue in the verdict:
  fix it (dispatch a targeted subtask or do it yourself), then re-run
  review_work. At most {{ max_fix_rounds }} fix rounds. You may reject a
  finding only with written justification in the plan file's "Review
  adjudication" section — unresolved rejections mean NO submission.

  PHASE 5 — SUBMIT (gated). Only when the latest verdict is "approve":
    - {{ submit }} == "never": stop; report the branch and verdict.
    - {{ submit }} == "branch": push the work branch. No PR.
    - {{ submit }} == "pr": push the branch and create a PR with `gh pr
      create`; the body must include the success criteria, a subtask summary
      table (subtask → model that executed it, from the router disclosure
      lines), and the reviewer's verdict summary. Never force-push; never
      push to main.
  If approval was not achieved within the round limit, do NOT submit — push
  nothing, report what remains broken and why.

  FINAL REPORT. End with: success criteria and how each is met; per-subtask
  outcomes (including which model router-acp chose — visible in the
  [router-acp] lines of each subrecipe result); reviewer verdict history;
  what was submitted (or why not).

  AFTER THE PIPELINE — INTERACTIVE FOLLOW-UPS. The session stays open and
  the user may keep talking to you about the work. You remain the
  orchestrator with the same tools:
  - Questions about the work: answer directly from your context.
  - Small change requests: dispatch a targeted implement_subtask (or make a
    trivial edit yourself), run its acceptance checks, and report. No full
    pipeline re-run.
  - Substantial new scope: treat it as a fresh task — offer to run the full
    plan → execute → review cycle again, and if anything will be submitted
    (push/PR update) run review_work again first; the submission gate never
    lapses just because the session got conversational.
  Keep every follow-up on the work branch; the no-force-push and
  never-push-to-main rules continue to apply.
prompt: |
  [router: candidate={{ planner_candidate }}, label={{ run_label }}]
  {% if task %}
  Orchestrate the following task end-to-end using the plan → parallel
  subtasks → independent review → gated submission workflow. When you write
  subtask and review prompts, prepend `[router: label={{ run_label }}]` to
  each (and `[router: exclude={{ planner_lineage }}]` on the review) so every
  session of this run is grouped under the same label in router-acp's state
  DB for observability.

  {{ task }}
  {% else %}
  No task was provided yet. Briefly introduce the workflow you run
  (plan → parallel routed subtasks → independent cross-lineage review →
  gated submission), then ask the user for the task to orchestrate. Do
  NOTHING else until they reply — their next message is the ORIGINAL TASK
  (quote it verbatim in the plan and pass it verbatim to the reviewer).
  {% endif %}
parameters:
  - key: task
    input_type: string
    requirement: optional
    default: ""
    description: >
      The compound task, verbatim from the user. Omit it to be asked
      interactively (run with -s / --interactive).
  - key: repo_path
    input_type: string
    requirement: optional
    default: "."
    description: "Target checkout / working directory."
  - key: planner_candidate
    input_type: string
    requirement: optional
    default: "claude/claude-fable-5[1m]"
    description: "router-acp candidate that plans and orchestrates (agent/model)."
  - key: planner_lineage
    input_type: string
    requirement: optional
    default: "claude"
    description: "Agent name of the planner's lineage; the reviewer EXCLUDES it."
  - key: reviewer_candidate
    input_type: string
    requirement: optional
    default: "codex/gpt-5.5"
    description: >
      Preferred reviewer candidate (agent/model), a DIFFERENT lineage than the
      planner. Soft preference: if unavailable (token-limited, down, or
      excluded) the router falls back to the best remaining non-planner
      candidate, so review never blocks on one model.
  - key: run_label
    input_type: string
    requirement: optional
    default: "orchestrate"
    description: >
      Grouping label applied to every session of this run (planner,
      subtasks, review) via the router `label=` directive, so `router-acp
      sessions` can show them together. Pass a unique value per run for clean
      separation.
  - key: max_fix_rounds
    input_type: number
    requirement: optional
    default: "2"
    description: "Maximum review→fix→re-review rounds before giving up."
  - key: submit
    input_type: string
    requirement: optional
    default: "branch"
    description: "Submission gate: never | branch | pr."
settings:
  # No goose_provider here: run the recipe under the router
  # (GOOSE_PROVIDER=pi-acp) so the [router: candidate=...] directive picks
  # the planner model, subtasks inherit the router, and headroom/cordons and
  # failover apply to every phase.
  max_turns: 200
sub_recipes:
  - name: "implement_subtask"
    path: "./subrecipes/subtask.subrecipe.yaml"
    description: >
      Execute one self-contained subtask in an isolated, router-routed
      session. Same-subrecipe calls with different parameters run in
      parallel.
  - name: "review_work"
    path: "./subrecipes/review.subrecipe.yaml"
    description: >
      Independent verification of the net result on a DIFFERENT model
      lineage; returns a structured verdict.
    values:
      planner_lineage: "{{ planner_lineage }}"
      reviewer_candidate: "{{ reviewer_candidate }}"
extensions:
  - type: platform
    name: developer
    timeout: 600
