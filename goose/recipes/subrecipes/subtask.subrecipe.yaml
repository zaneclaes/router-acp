version: "1.0.0"
title: "Implement Subtask"
description: >
  Executes ONE self-contained subtask authored by the orchestrator, in an
  isolated session. Deliberately declares no provider: it inherits the
  router provider, so router-acp classifies the subtask prompt and picks an
  appropriately sized model (mechanical edits go cheap, hard subtasks go
  frontier). Returns a structured JSON result.
instructions: |
  You are a SUBTASK EXECUTOR working in {{ repo_path }}. You received a
  single, self-contained subtask from an orchestrator. You have NO access to
  the orchestrator's conversation — everything you need is in the subtask
  prompt below. Rules:

  - Do ONLY what the subtask says. No drive-by refactors, no scope creep,
    no changes to files outside the subtask's stated scope. If the subtask
    cannot be completed as specified (missing context, conflicting code,
    wrong assumption), STOP and return status="blocked" with a precise
    explanation — a blocked report is more valuable than a guessed fix.
  - Follow the repository's conventions (.goosehints / CLAUDE.md / AGENTS.md
    in {{ repo_path }}).
  - Run the acceptance checks you were given and record their real output.
    Do not claim a check passed without running it.
  - Do NOT commit, push, or touch git history: the orchestrator owns the
    branch. Leave your changes in the working tree.
prompt: |
  Subtask {{ subtask_id }}:

  {{ subtask_prompt }}

  Acceptance checks (run these and report actual results):
  {{ acceptance }}
parameters:
  - key: subtask_id
    input_type: string
    requirement: required
    description: "Orchestrator-assigned id for this subtask."
  - key: subtask_prompt
    input_type: string
    requirement: required
    description: "Fully self-contained instructions for this subtask."
  - key: acceptance
    input_type: string
    requirement: required
    description: "Commands/criteria that must pass, with expected outcomes."
  - key: repo_path
    input_type: string
    requirement: optional
    default: "."
    description: "Target checkout / working directory."
settings:
  # No goose_provider on purpose: inherit the router so this subtask is
  # routed by its own complexity. The orchestrator's contextual prompt IS
  # the routing input.
  max_turns: 60
extensions:
  - type: platform
    name: developer
    timeout: 600
response:
  json_schema:
    type: object
    properties:
      status:
        type: string
        enum: ["done", "blocked"]
        description: "done = implemented and checks ran; blocked = could not proceed as specified."
      summary:
        type: string
        description: "What was changed and why, two to four sentences."
      files_changed:
        type: array
        items: { type: string }
        description: "Paths actually modified."
      checks:
        type: array
        description: "Each acceptance check that was run, verbatim, with its outcome."
        items:
          type: object
          properties:
            command: { type: string }
            passed: { type: boolean }
            output_excerpt: { type: string }
          required: ["command", "passed"]
      blocked_reason:
        type: string
        description: "Only when status=blocked: exactly what is missing or wrong."
    required: ["status", "summary", "files_changed", "checks"]
