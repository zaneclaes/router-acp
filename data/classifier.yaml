# Deterministic rule tables for the heuristic classifier.
#
# Each rule adds `weight` to `class` when any keyword matches the first
# prompt (case-insensitive substring). The class with the highest total wins;
# ties break by the fixed TaskClass declaration order. With no keyword hits
# the class defaults to CodingGeneral.
version: 1
classes:
  - class: UiTweak
    weight: 2.0
    keywords: [css, styling, style, padding, margin, color, colour, font, button label, copy change, tooltip, alignment, layout tweak, ui tweak, icon, spacing]
  - class: BugFix
    weight: 2.0
    keywords: [bug, fix, broken, crash, error, exception, regression, doesn't work, does not work, failing test, stack trace, npe, panic]
  - class: Feature
    weight: 1.5
    keywords: [add, implement, feature, support for, new endpoint, new page, new command, build a, create a]
  - class: Refactor
    weight: 2.0
    keywords: [refactor, clean up, cleanup, restructure, rename, extract, simplify, tidy, dedupe, deduplicate, reorganize]
  - class: Algorithms
    weight: 2.0
    keywords: [algorithm, complexity, big-o, optimize, optimise, performance, data structure, sort, search, dynamic programming, graph, tree traversal]
  - class: Architecture
    weight: 2.0
    keywords: [architecture, design, schema, migration plan, system design, scalab, module boundaries, api design, protocol design, tradeoff, trade-off]
  - class: Research
    weight: 2.0
    keywords: [research, investigate, investigation, compare, evaluate, survey, find out, look into, what are the options, pros and cons, analyze, analyse, summarize, summarise, status of, current state, review the, audit]
  - class: Writing
    weight: 2.0
    keywords: [write docs, documentation, readme, blog post, changelog, release notes, comment, docstring, tutorial, guide]
  - class: Ops
    weight: 2.0
    keywords: [deploy, ci, cd, pipeline, docker, kubernetes, k8s, terraform, infra, monitoring, alert, nginx, systemd, provision]
  - class: CodingGeneral
    weight: 0.5
    keywords: [code, function, class, method, test]

# Complexity features. The base is a length ramp; keyword groups add their
# bump per matching keyword (capped at two hits per group); each mentioned
# file path adds `per_file_bump` up to `max_file_bump`. The result is
# clamped to [0, 1].
complexity:
  length_full_score_chars: 1200
  length_max: 0.4
  per_file_bump: 0.05
  max_file_bump: 0.2
  keyword_bumps:
    - bump: 0.3
      keywords: [architecture, redesign, migrate, migration, rewrite, distributed, concurren, security audit, refactor the whole, across the codebase, end-to-end]
    - bump: 0.2
      keywords: [multiple, several, all the, every, entire, whole project, complex, tricky, subtle, race condition, deadlock]
    # A follow-up after a failed fix is strong evidence that the work is more
    # difficult than the original request suggested, even if the prompt is
    # short or describes the expected fix as simple.
    - bump: 0.15
      floor: 0.7
      keywords: [following up on a bug, follow-up on a bug, follow up on a bug, still broken, didn't work, did not work, reopened, re-opened, prior agent failed, failed the task, second attempt]
    # Cross-system work (repos, tickets, PRs) and open-ended investigation
    # are complex even when the prompt is short.
    - bump: 0.15
      keywords: [pull request, merge request, " pr ", ticket, issue, investigate, investigating, investigation, analyze, analyse, audit, remaining work, status of, current state, deep dive, root cause, thorough, comprehensive, cross-cutting, as long as you need]
    - bump: -0.25
      keywords: [typo, one-line, one line, trivial, quick, tiny, small change, simple, just change, rename this]

# Multi-step prompts ("do X and Y, then leave a comment") get a bump per
# conjunction/sequencing token, capped.
multi_step:
  per_token_bump: 0.06
  max_bump: 0.24
  tokens: [" and ", " then ", " plus ", ", and", " + ", " also ", " after that", " as well as ", " followed by "]

# Filename extensions to language names, used for language detection from
# prompt mentions and cwd scans.
languages:
  rs: rust
  py: python
  ts: typescript
  tsx: typescript
  js: javascript
  jsx: javascript
  go: go
  java: java
  kt: kotlin
  rb: ruby
  php: php
  cs: csharp
  c: c
  h: c
  cc: cpp
  cpp: cpp
  hpp: cpp
  swift: swift
  m: objective-c
  scala: scala
  sh: shell
  zsh: shell
  bash: shell
  sql: sql
  html: html
  css: css
  scss: css
  vue: vue
  svelte: svelte
  tf: terraform
  yaml: yaml
  yml: yaml

# ---------------------------------------------------------------------------
# The quality scale. Fixed, deliberately NOT min-maxed over the live models:
# adding one model never changes another model's calibration. 1 = minimal,
# 2 = standard, 3 = frontier; decimals preserve measured differences inside a
# band; 0.5 and 3.5 are the hard extrapolation limits.
#
# Each benchmark has fixed raw-result anchors for quality 1, 2 and 3.
# Piecewise interpolation/extrapolation (clipped to the band) turns a model's
# `evidence` result (data/providers/<name>.yaml) into a comparable quality unit. Anchors move only when the
# benchmark itself changes version. A model's `default_quality` is the
# weighted mean of its observations; a task-class override is emitted only
# when at least `minimum_task_observations` mapped observations agree and
# differ from the default by >= `meaningful_task_delta`.
# ---------------------------------------------------------------------------
scoring:
  quality_band: { min: 0.5, max: 3.5 }
  round_to: 0.01
  minimum_task_observations: 2
  meaningful_task_delta: 0.15
  benchmarks:
    AA-Coding-Agent-v1.1:
      task_classes: [Algorithms, CodingGeneral]
      anchors: { minimal: 70, standard: 75, frontier: 78 }
    SWE-Bench-Pro:
      task_classes: [BugFix, Feature, Refactor, CodingGeneral]
      anchors: { minimal: 60, standard: 69, frontier: 80 }
    DeepSWE-v1.1:
      task_classes: [BugFix, Feature, Refactor, CodingGeneral]
      anchors: { minimal: 50, standard: 60, frontier: 70 }
    Terminal-Bench-2.1:
      task_classes: [Ops, Research, Architecture]
      anchors: { minimal: 78, standard: 84, frontier: 89 }
    SWE-Bench-Verified-2025:
      task_classes: [BugFix, Feature, Refactor, CodingGeneral]
      anchors: { minimal: 70, standard: 77, frontier: 84 }
    Terminal-Bench-1:
      task_classes: [Ops, Research, Architecture]
      anchors: { minimal: 40, standard: 55, frontier: 70 }
    Local-Executable-Gate:
      task_classes: [UiTweak, Ops, CodingGeneral]
      anchors: { minimal: 1, standard: 2, frontier: 3 }
    Kimi-SWE-Bench-Verified:
      task_classes: [BugFix, Feature, Refactor, CodingGeneral]
      anchors: { minimal: 55, standard: 70, frontier: 80 }
    Kimi-TerminalBench:
      task_classes: [Ops, Research, Architecture]
      anchors: { minimal: 20, standard: 35, frontier: 50 }
    Kimi-BrowseComp:
      task_classes: [Research, Architecture]
      anchors: { minimal: 30, standard: 50, frontier: 70 }
    # The three below are Vals.ai boards, each one harness across nearly every
    # model (2026-11-09). Anchors were set once, on 2026-11-12, from the field
    # then: `minimal` at the small models' results, `standard` at the mid-tier
    # models', `frontier` at the strongest flagships'. They stay fixed, so a new
    # model's result never moves another model's score.
    Vibe-Code-Bench-v1.1:          # build a working app end to end (OpenHands)
      task_classes: [UiTweak, Feature, CodingGeneral]
      anchors: { minimal: 75, standard: 85, frontier: 92 }
    Terminal-Bench-4.0:            # Mini-SWE-agent, avg@3
      task_classes: [Ops, Research, Architecture]
      anchors: { minimal: 12, standard: 37, frontier: 65 }
    Terminal-Bench-Science-0.1:    # Mini-SWE-agent
      task_classes: [Research, Algorithms]
      anchors: { minimal: 5, standard: 25, frontier: 55 }

# ---------------------------------------------------------------------------
# `cost_rank` is an ORDINAL 1..5 (1 = cheapest/least scarce, 5 = frontier/
# scarce), not USD: seats are flat-rate, and `auto` min-max normalizes rank
# inside the surviving pool. Do not extend past 5: that rescales every pool
# norm and moves models you did not touch. Ranks are weakly monotonic in
# blended price (input + blended_output_weight * output) within a provider;
# a row that breaks that states why in its `rank_exception`.
# ---------------------------------------------------------------------------
cost:
  ladder: { min: 1, max: 5 }
  blended_output_weight: 3
