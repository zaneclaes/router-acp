      UiTweak: 0.78
      BugFix: 0.8
      Feature: 0.76
      Refactor: 0.78
      Algorithms: 0.74
      Architecture: 0.66
      Research: 0.66
      Writing: 0.68
      Ops: 0.72
      CodingGeneral: 0.8

  - pattern: "*grok*"                # grok-4.5 and future frontier grok
    coding_tier: high
    coding_percentile: 0.88
    context_window: 256000
    default_quality: 1.57
    quality:
