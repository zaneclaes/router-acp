# Versioned quality/score data for router-acp candidates.
#
# Keyed by candidate pattern (`agent/model`, `*` wildcards, case-insensitive,
# first match wins). Contains per-class quality scores in [0, 1], a coding
# tier + percentile band (router-acp's own coding-frontier scheme, not a
# documented OpenRouter algorithm), context window, and optional tags.
# Updating routing quality is a data edit, not a
# code change. Override the whole file with the `score_table` config key.
version: 1
candidates:
  # Order matters: the FIRST matching pattern wins, so specific patterns
  # (e.g. `*mini*`) must precede broad family patterns (e.g. `*gpt-5*`).
  - pattern: "*fable*"
    coding_tier: high
    coding_percentile: 0.97
    context_window: 1000000
    default_quality: 0.95
    quality:
      UiTweak: 0.9
      BugFix: 0.95
      Feature: 0.95
      Refactor: 0.95
      Algorithms: 0.97
      Architecture: 0.97
      Research: 0.95
      Writing: 0.95
      Ops: 0.9
      CodingGeneral: 0.95

  # GPT "sol / terra / luna" lines (ids like `gpt-5.6-sol`). Kept above the
  # `*gpt-5*` patterns so a `gpt-5.6-sol` id doesn't fall through to the generic
  # gpt-5 entry (first match wins). The `sol`/`terra`/`luna` substrings don't
  # collide with any other model id in play (sonnet/opus/haiku/mini/fable/gpt).
  #
  # Tier ordering is a PROVISIONAL guess (sol = frontier ≈ fable, terra = strong
  # ≈ opus, luna = small/fast ≈ haiku). Re-benchmark and tune once the models are
  # actually live — as of this writing codex only exposes gpt-5.4/5.4-mini/5.5.
  - pattern: "*sol*"
    coding_tier: high
    coding_percentile: 0.96
    context_window: 400000
    default_quality: 0.95
    quality:
      UiTweak: 0.9
      BugFix: 0.95
      Feature: 0.95
      Refactor: 0.95
      Algorithms: 0.96
      Architecture: 0.95
      Research: 0.93
      Writing: 0.9
      Ops: 0.9
      CodingGeneral: 0.95

  - pattern: "*terra*"
    coding_tier: high
    coding_percentile: 0.9
    context_window: 400000
    default_quality: 0.85
