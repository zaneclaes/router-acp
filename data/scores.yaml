# Versioned quality/score data for router-acp candidates.
#
# Keyed by candidate pattern (`agent/model`, `*` wildcards, case-insensitive,
# first match wins). Contains benchmark capability scores in [0.5, 3.5]
# (1=minimal, 2=standard, 3=frontier), a coding
# tier + percentile band (router-acp's own coding-frontier scheme, not a
# documented OpenRouter algorithm), context window, the wire features the model
# accepts (`max_output_tokens`, `adaptive_thinking`, `effort` — consulted by the
# per-request proxy, which forwards every request byte but the model name, so a
# reroute target has to accept the incoming request's shape), and optional tags.
# Updating routing quality is a data edit, not a
# code change. Override the whole file with the `score_table` config key.
version: 1
candidates:
  # Order matters: the FIRST matching pattern wins, so specific patterns
  # (e.g. `*mini*`) must precede broad family patterns (e.g. `*gpt-5*`).
  - pattern: "*fable*"
    coding_tier: high
    coding_percentile: 0.97
    context_window: 1000000
    max_output_tokens: 128000
    effort_levels: [low, medium, high, xhigh, max]
    effort_mapping: { low: low, medium: medium, high: high, xhigh: max, max: max }
    # Calibrated from AA Coding Agent, SWE-Bench Pro, DeepSWE, and Terminal-Bench.
    # The implementation lift is supported by two coding benchmarks; classes
    # without two agreeing task-specific observations keep the aggregate.
    default_quality: 2.64
    quality:
      UiTweak: 2.64
      BugFix: 2.99
      Feature: 2.99
      Refactor: 2.99
      Algorithms: 2.64
      Architecture: 2.64
      Research: 2.64
      Writing: 2.64
      Ops: 2.64
      CodingGeneral: 2.90

  # GPT "sol / terra / luna" lines (ids like `gpt-5.6-sol`). Kept above the
  # `*gpt-5*` patterns so a `gpt-5.6-sol` id doesn't fall through to the generic
  # gpt-5 entry (first match wins). The `sol`/`terra`/`luna` substrings don't
  # collide with any other model id in play (sonnet/opus/haiku/mini/fable/gpt).
  #
  # Scores are calibrated from OpenAI's published four-benchmark comparison.
  # Sol's aggregate is frontier-adjacent, while its two implementation
  # benchmarks support a lower per-task override.
  - pattern: "*sol*"
    coding_tier: high
    coding_percentile: 0.96
    context_window: 400000
    effort_levels: [low, medium, high, xhigh, max]
    effort_mapping: { low: low, medium: medium, high: high, xhigh: high, max: high }
    default_quality: 2.81
    quality:
      UiTweak: 2.81
      BugFix: 2.39
      Feature: 2.39
      Refactor: 2.39
      Algorithms: 2.81
      Architecture: 2.81
      Research: 2.81
      Writing: 2.81
      Ops: 2.81
      CodingGeneral: 2.81

  - pattern: "*terra*"
    coding_tier: high
    coding_percentile: 0.9
    context_window: 400000
    effort_levels: [low, medium, high]
    effort_mapping: { low: low, medium: medium, high: high }
    default_quality: 2.45
    quality:
      UiTweak: 2.45
      BugFix: 2.17
      Feature: 2.17
      Refactor: 2.17
      Algorithms: 2.45
      Architecture: 2.45
      Research: 2.45
      Writing: 2.45
      Ops: 2.45
      CodingGeneral: 2.45

  - pattern: "*luna*"
    coding_tier: medium
    coding_percentile: 0.5
    context_window: 400000
    effort_levels: [low, medium, high]
    effort_mapping: { low: low, medium: medium, high: high }
    default_quality: 2.02
    quality:
      UiTweak: 2.02
      BugFix: 2.02
      Feature: 2.02
      Refactor: 2.02
      Algorithms: 2.02
      Architecture: 2.02
      Research: 2.02
      Writing: 2.02
      Ops: 2.02
      CodingGeneral: 2.02

  # Claude Opus 5 (`claude-opus-5` / CLI alias `opus[1m]`). Until an Opus 5
  # comparison card is published, the updater conservatively uses the published
  # Opus 4.8 comparison row as its benchmark proxy.
  - pattern: "*opus*"
    coding_tier: high
    coding_percentile: 0.93
    context_window: 1000000
    max_output_tokens: 128000
    effort_levels: [low, medium, high, xhigh, max]
    effort_mapping: { low: low, medium: medium, high: high, xhigh: max, max: max }
    default_quality: 1.64
    quality:
      UiTweak: 1.64
      BugFix: 1.96
      Feature: 1.96
      Refactor: 1.96
      Algorithms: 1.64
      Architecture: 1.64
      Research: 1.64
      Writing: 1.64
      Ops: 1.64
      CodingGeneral: 1.81

  - pattern: "*sonnet*"
    coding_tier: high
    coding_percentile: 0.8
    context_window: 1000000
    max_output_tokens: 128000
    effort_levels: [low, medium, high, xhigh, max]
    effort_mapping: { low: low, medium: medium, high: high, xhigh: max, max: max }
    default_quality: 1.38
    quality:
      UiTweak: 1.38
      BugFix: 1.38
      Feature: 1.38
      Refactor: 1.38
      Algorithms: 1.38
      Architecture: 1.38
      Research: 1.38
      Writing: 1.38
      Ops: 1.38
      CodingGeneral: 1.38

  # Haiku 4.5 predates adaptive thinking and the effort parameter: a request
  # carrying `thinking: {type: adaptive}` or `output_config.effort` is rejected
  # outright. Since the per-request proxy rewrites only the model field and
  # forwards every other byte, Haiku cannot serve a request shaped by a newer
  # model — the wire flags below keep it out of that demotion set.
  - pattern: "*haiku*"
    coding_tier: medium
    coding_percentile: 0.5
    context_window: 200000
    max_output_tokens: 64000
    adaptive_thinking: false
    effort: false
    default_quality: 1.29
    quality:
      UiTweak: 1.29
      BugFix: 1.29
      Feature: 1.29
      Refactor: 1.29
      Algorithms: 1.29
      Architecture: 1.29
      Research: 1.29
      Writing: 1.29
      Ops: 1.29
      CodingGeneral: 1.29

  # Gemini MUST precede `*mini*`: "gemini" literally contains the substring
  # "mini", so under first-match-wins a `*mini*` entry placed above these would
  # score every Gemini id as a small mini-class model (Pro included).
  - pattern: "*gemini*pro*"
    coding_tier: high
    coding_percentile: 0.75
    context_window: 1000000
    default_quality: 0.75

  - pattern: "*gemini*flash*"
    coding_tier: medium
    coding_percentile: 0.5
    context_window: 1000000
    default_quality: 0.55

  - pattern: "*mini*"
    coding_tier: medium
    coding_percentile: 0.45
    context_window: 400000
    default_quality: 1.00
    quality:
      UiTweak: 1.00
      BugFix: 1.00
      Feature: 1.00
      Refactor: 1.00
      Algorithms: 1.00
      Architecture: 1.00
      Research: 1.00
      Writing: 1.00
      Ops: 1.00
      CodingGeneral: 1.00

  - pattern: "*gpt-5*codex*"
    coding_tier: high
    coding_percentile: 0.85
    context_window: 400000
    default_quality: 0.8
    quality:
      UiTweak: 0.8
      BugFix: 0.85
      Feature: 0.82
      Refactor: 0.82
      Algorithms: 0.85
      Architecture: 0.8
      Research: 0.7
      Writing: 0.7
      Ops: 0.75
      CodingGeneral: 0.82

  - pattern: "*gpt-5*"
    coding_tier: high
    coding_percentile: 0.8
    context_window: 400000
    default_quality: 2.11
    quality:
      UiTweak: 2.11
      BugFix: 1.82
      Feature: 1.82
      Refactor: 1.82
      Algorithms: 2.11
      Architecture: 2.11
      Research: 2.11
      Writing: 2.11
      Ops: 2.11
      CodingGeneral: 2.11

  # xAI Grok. `*grok*code*` MUST precede `*grok*` (first-match-wins).
  # Grok 4.5 is calibrated from xAI's SWE-Bench Pro, DeepSWE, and
  # Terminal-Bench results. The disabled code-fast entry remains provisional.
  - pattern: "*grok*code*"           # grok-code-fast-* (cheap fast coder)
    coding_tier: medium
    coding_percentile: 0.62
    context_window: 256000
    default_quality: 0.72
    quality:
      UiTweak: 0.78
      BugFix: 0.8
      Feature: 0.76
      Refactor: 0.78
      Algorithms: 0.74
      Architecture: 0.66
      Research: 0.66
      Writing: 0.68
      Ops: 0.72
      CodingGeneral: 0.8

  - pattern: "*grok*"                # grok-4.5 and future frontier grok
    coding_tier: high
    coding_percentile: 0.88
    context_window: 256000
    default_quality: 1.57
    quality:
      UiTweak: 1.57
      BugFix: 1.41
      Feature: 1.41
      Refactor: 1.41
      Algorithms: 1.57
      Architecture: 1.57
      Research: 1.57
      Writing: 1.57
      Ops: 1.57
      CodingGeneral: 1.41

  # Moonshot Kimi K2 — calibrated from Moonshot's published SWE/Terminal
  # results; K2 Thinking uses its SWE-Bench Verified and BrowseComp results.
  # `*kimi*k2*thinking*` (the reasoning variant) is stronger, so it MUST precede
  # the broad `*kimi*` (first-match-wins). Tune once you've run real tasks.
  - pattern: "*kimi*k2*thinking*"    # Kimi K2 Thinking (reasoning-tuned)
    coding_tier: high
    coding_percentile: 0.85
    context_window: 256000
    default_quality: 2.32
    quality:
      UiTweak: 2.32
      BugFix: 2.32
      Feature: 2.32
      Refactor: 2.32
      Algorithms: 2.32
      Architecture: 2.32
      Research: 2.32
      Writing: 2.32
      Ops: 2.32
      CodingGeneral: 2.32

  - pattern: "*kimi*"                # kimi-k2 / kimi-latest and other kimi models
    coding_tier: high
    coding_percentile: 0.78
    context_window: 256000
    default_quality: 1.69
