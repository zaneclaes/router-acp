      Feature: 0.88
      Refactor: 0.88
      Algorithms: 0.88
      Architecture: 0.87
      Research: 0.83
      Writing: 0.83
      Ops: 0.85
      CodingGeneral: 0.88

  - pattern: "*luna*"
