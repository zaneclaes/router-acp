    # typo). DeepSWE is the public v1.1 leaderboard. No AA-Coding-Agent row:
    # AA's current index publishes on a points scale that does not map onto
    evidence:
      - { benchmark: SWE-Bench-Pro, result: 79.2, source: "https://www.anthropic.com/news/claude-opus-5" }
      - { benchmark: DeepSWE-v1.1, result: 73.6, source: "https://deepswe.datacurve.ai/" }
      - { benchmark: Terminal-Bench-2.1, result: 89.1, source: "https://artificialanalysis.ai/evaluations/terminalbench-v2-1" }
      - { benchmark: Vibe-Code-Bench-v1.1, result: 88.4, source: "https://www.vals.ai/benchmarks/vibe-code" }
      - { benchmark: Terminal-Bench-4.0, result: 53.53, source: "https://www.vals.ai/benchmarks/terminal-bench-4" }
      - { benchmark: Terminal-Bench-Science-0.1, result: 27.14, source: "https://www.vals.ai/benchmarks/terminal-bench-science" }
      - { benchmark: Terminal-Bench-2.1, result: 84.64, source: "https://www.vals.ai/benchmarks/terminal-bench-2-1" }
    coding_tier: high
    coding_percentile: 0.93
    context_window: 1000000
    max_output_tokens: 128000
    effort_levels: [low, medium, high, xhigh, max]
    default_quality: 2.65
    quality: { UiTweak: 2.65, BugFix: 3.14, Feature: 2.92, Refactor: 3.14, Algorithms: 2.65, Architecture: 2.65, Research: 2.45, Writing: 2.65, Ops: 2.65, CodingGeneral: 2.92 }
    # Opus 4.6 predates mid-conversation `role: "system"` turns (Claude Code's
    # `mid-conversation-system` beta), which Claude Code sends when configured
    # with a newer alias; `system_turns: false` makes the proxy fold them into
