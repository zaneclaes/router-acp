    display_name: Claude Opus 5.5
    cost_rank: 4
    pricing: { input_per_mtok: 4.0, output_per_mtok: 20.0, cache_read_per_mtok: 0.2, cache_write_per_mtok: 5.0 }
    # Vals' Terminus 2 run (2026-10-01; 79.77 if fallback-assisted tasks count as failures).
    evidence:
      - { benchmark: Terminal-Bench-2.1, result: 87.64, source: "https://vals.ai/benchmarks/terminal-bench-2-1" }
      - { benchmark: Vibe-Code-Bench-v1.1, result: 90.29, source: "https://www.vals.ai/benchmarks/vibe-code" }
      - { benchmark: Terminal-Bench-4.0, result: 65.15, source: "https://www.vals.ai/benchmarks/terminal-bench-4" }
      - { benchmark: Terminal-Bench-Science-0.1, result: 47.14, source: "https://www.vals.ai/benchmarks/terminal-bench-science" }
    context_window: 1000000
    max_output_tokens: 128000
    effort_levels: [low, medium, high, xhigh, max]
    default_quality: 2.81
    quality: { UiTweak: 2.81, BugFix: 2.81, Feature: 2.81, Refactor: 2.81, Algorithms: 2.81, Architecture: 2.81, Research: 2.81, Writing: 2.81, Ops: 2.81, CodingGeneral: 2.81 }
  - version: 5
    id: claude-opus-5
    display_name: Claude Opus 5
    cost_rank: 4
    pricing: { input_per_mtok: 5.0, output_per_mtok: 25.0, cache_read_per_mtok: 0.5, cache_write_per_mtok: 6.25 }
    # Claude Opus 5 (card published 2026-07-24). SWE-Bench-Pro comes from the
    # same system-card table as the Fable 80.0 / Sol 64.6 rows. Terminal-Bench
