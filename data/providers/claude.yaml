      - { benchmark: Terminal-Bench-Science-0.1, result: 5.71, source: "https://www.vals.ai/benchmarks/terminal-bench-science" }
      - { benchmark: Terminal-Bench-2.1, result: 74.53, source: "https://www.vals.ai/benchmarks/terminal-bench-2-1" }
    coding_tier: high
    coding_percentile: 0.8
    context_window: 1000000
    max_output_tokens: 128000
    effort_levels: [low, medium, high, xhigh, max]
    default_quality: 1.18
    quality: { UiTweak: 1.18, BugFix: 1.38, Feature: 1.46, Refactor: 1.38, Algorithms: 1.18, Architecture: 0.95, Research: 0.97, Writing: 1.18, Ops: 0.95, CodingGeneral: 1.46 }
  opus:
