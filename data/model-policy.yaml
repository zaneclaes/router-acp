# Model catalog + scoring POLICY for router-acp.
#
# `data/scores.yaml` holds the quality numbers the router actually loads; this
# file holds the *procedure* that produced them and the invariants they must
# keep. Rust does not read this file — `scripts/update_models.py` does. See
# `docs/model-updater.md`.
#
# Division of labour, on purpose:
#   * sourced observations and fixed benchmark calibrations are authoritative.
#   * scores.yaml is deterministic output plus routing capabilities/comments.
version: 1

# ---------------------------------------------------------------------------
# Quality scale. Fixed, deliberately NOT min-maxed over the live candidate set:
# adding one model never changes another model's benchmark calibration.
# ---------------------------------------------------------------------------
anchors:
  # 1 = minimal, 2 = standard, 3 = frontier. Decimals preserve measured
  # differences inside a band; 0.5 and 3.5 are the hard extrapolation limits.
  quality_band: { min: 0.5, max: 3.5 }
  round_to: 0.01

# Each benchmark has fixed raw-result anchors for quality 1, 2, and 3.
# Piecewise interpolation/extrapolation (clipped to 0.5..3.5) turns an observed
# result into a comparable quality unit. These anchors move only when the
# benchmark itself changes version. A model's default is the weighted mean of
# its observations. A TaskClass override is emitted only when at least two
# mapped observations agree and differ from the default by >= 0.15.
benchmark_scoring:
  minimum_task_observations: 2
  meaningful_task_delta: 0.15
  benchmarks:
    AA-Coding-Agent-v1.1:
      task_classes: [Algorithms, CodingGeneral]
      anchors: { minimal: 70, standard: 75, frontier: 78 }
    SWE-Bench-Pro:
      task_classes: [BugFix, Feature, Refactor, CodingGeneral]
      anchors: { minimal: 60, standard: 69, frontier: 80 }
    DeepSWE-v1.1:
      task_classes: [BugFix, Feature, Refactor, CodingGeneral]
      anchors: { minimal: 50, standard: 60, frontier: 70 }
    Terminal-Bench-2.1:
      task_classes: [Ops, Research, Architecture]
      anchors: { minimal: 78, standard: 84, frontier: 89 }
    SWE-Bench-Verified-2025:
      task_classes: [BugFix, Feature, Refactor, CodingGeneral]
      anchors: { minimal: 70, standard: 77, frontier: 84 }
    Terminal-Bench-1:
      task_classes: [Ops, Research, Architecture]
      anchors: { minimal: 40, standard: 55, frontier: 70 }
    Local-Executable-Gate:
      task_classes: [UiTweak, Ops, CodingGeneral]
      anchors: { minimal: 1, standard: 2, frontier: 3 }
    Kimi-SWE-Bench-Verified:
      task_classes: [BugFix, Feature, Refactor, CodingGeneral]
      anchors: { minimal: 55, standard: 70, frontier: 80 }
    Kimi-TerminalBench:
      task_classes: [Ops, Research, Architecture]
      anchors: { minimal: 20, standard: 35, frontier: 50 }
    Kimi-BrowseComp:
      task_classes: [Research, Architecture]
      anchors: { minimal: 30, standard: 50, frontier: 70 }
  model_evidence:
    "*fable*":
      - { benchmark: AA-Coding-Agent-v1.1, result: 77.2, source: "https://openai.com/index/gpt-5-6/" }
      - { benchmark: SWE-Bench-Pro, result: 80.0, source: "https://openai.com/index/gpt-5-6/" }
      - { benchmark: DeepSWE-v1.1, result: 69.7, source: "https://openai.com/index/gpt-5-6/" }
      - { benchmark: Terminal-Bench-2.1, result: 83.1, source: "https://openai.com/index/gpt-5-6/" }
    "*sol*":
      - { benchmark: AA-Coding-Agent-v1.1, result: 80.0, source: "https://openai.com/index/gpt-5-6/" }
      - { benchmark: SWE-Bench-Pro, result: 64.6, source: "https://openai.com/index/gpt-5-6/" }
      - { benchmark: DeepSWE-v1.1, result: 72.7, source: "https://openai.com/index/gpt-5-6/" }
      - { benchmark: Terminal-Bench-2.1, result: 88.8, source: "https://openai.com/index/gpt-5-6/" }
    "*terra*":
      - { benchmark: AA-Coding-Agent-v1.1, result: 77.4, source: "https://openai.com/index/gpt-5-6/" }
      - { benchmark: SWE-Bench-Pro, result: 63.4, source: "https://openai.com/index/gpt-5-6/" }
      - { benchmark: DeepSWE-v1.1, result: 69.6, source: "https://openai.com/index/gpt-5-6/" }
      - { benchmark: Terminal-Bench-2.1, result: 87.4, source: "https://openai.com/index/gpt-5-6/" }
    "*luna*":
      - { benchmark: AA-Coding-Agent-v1.1, result: 74.6, source: "https://openai.com/index/gpt-5-6/" }
      - { benchmark: SWE-Bench-Pro, result: 62.7, source: "https://openai.com/index/gpt-5-6/" }
      - { benchmark: DeepSWE-v1.1, result: 67.2, source: "https://openai.com/index/gpt-5-6/" }
      - { benchmark: Terminal-Bench-2.1, result: 84.7, source: "https://openai.com/index/gpt-5-6/" }
    "*gpt-5*":
      - { benchmark: AA-Coding-Agent-v1.1, result: 76.4, source: "https://openai.com/index/gpt-5-6/" }
      - { benchmark: SWE-Bench-Pro, result: 59.4, source: "https://openai.com/index/gpt-5-6/" }
      - { benchmark: DeepSWE-v1.1, result: 67.0, source: "https://openai.com/index/gpt-5-6/" }
      - { benchmark: Terminal-Bench-2.1, result: 85.6, source: "https://openai.com/index/gpt-5-6/" }
    "*opus*":
      # Real Claude Opus 5 rows (card published 2026-07-24), replacing the
