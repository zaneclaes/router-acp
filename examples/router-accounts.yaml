# Two independently authenticated Claude accounts for Goose desktop.
# The empty environment on `existing` preserves the normal Claude login.
cordon:
  enabled: true

# `providers:` changes router-acp's defaults for a provider; `agents:` lists
# the accounts, each inheriting its provider's settings.
providers:
  claude:
    auth_probe:
      command: claude
      args: [auth, status]

agents:
  - name: claude
    accounts:
      - name: existing
        priority: 0
        env: []
        reserve_capacity:
          weekly: 10
          session: 20
      - name: personal
        priority: 1
        env:
          - name: CLAUDE_CONFIG_DIR
            value: ${HOME}/.config/router-acp/accounts/claude/personal
        reserve_capacity:
          weekly: 10
          session: 20
