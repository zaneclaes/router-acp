state_file: ~/.local/state/router-acp/sessions.db

# EXAMPLE config for standalone / non-Hickory deployments of router-acp.
# Hickory engineer workstations do NOT load this file — their source of truth
# is hickory-ai's `kory-code/router.yaml`, shipped by `dev-env code-install`.
# Keep this example useful for new router-acp consumers; Hickory routing policy
# changes land in the monorepo file, not here.
#
# Opt in only after the adapter-specific endpoints and `api_model` ids below
# have been verified. This moves routing from one decision per ACP turn to one
# decision per provider inference request while preserving auth and SSE.
llm_proxy:
  enabled: true
  listen: 127.0.0.1:0
  routine_streak: 3
  # Small on purpose. This is a FIXED request count, so on real traffic it never
  # prevents a bad switch — it just delays every good one: measured over the
  # recorded history, 0 of 7 sessions ran shorter than 12 requests (median 124),
  # so a dwell of 12 taxed 12% of all traffic onto the pinned model and blocked
  # nothing. It also delays DE-escalation, since returning to the pin after a
  # difficulty verdict expires is not an emergency switch and so has to wait it
  # out on the more expensive model. Real hysteresis comes from the cache
  # re-prime break-even (see the per-model cache rates below), which is
  # economically exact; this only damps single-request flapping.
  minimum_dwell_requests: 2
  verdict_ttl_requests: 6
  verdict_ttl_secs: 900
  context_window_fraction: 0.9

delegation:
  enabled: true
  # Prompt ordinary parents to use router-owned delegation for bounded,
  # independent work when its briefing/verification overhead is worthwhile.
  inject_prompt: true
  # The host maps opaque capabilities to its registered MCP catalogs.
  mcp_catalogs: []
  max_concurrent: 3
  # The parent has already decomposed the work into a fully-specified brief;
  # long, detailed briefs otherwise classify as max complexity, which zeroes
  # the auto strategy's cost term (and trips its quality gate) so every
  # subtask lands on the most expensive candidate. Cap restores cost-aware
  # worker routing; 1.0 disables.
  complexity_cap: 0.6

agents:
  - name: claude
    command:
      type: stdio
      command: ~/nvm/versions/node/v24.16.0/bin/claude-agent-acp
    model_selection: { type: config-option }
    budget_prompts_5h: 400
    # Proactive cordoning: poll the Anthropic subscription usage API (CLI OAuth
    # token) and mark a candidate unroutable when its weekly cap is exhausted
    # with no overage/credit headroom — before the router even tries it.
    usage_source: { type: anthropic-oauth }
    # Auth-as-availability: a logged-out Claude still advertises every model, so
    # ask the CLI rather than trust the advertisement. Logged out prints
    # `"loggedIn": false`; anything unreadable (missing binary, timeout) is
    # unknown and fails open.
    auth_probe:
      command: claude
      args: ["auth", "status"]
      timeout_ms: 3000
      unauthenticated_patterns: ['"loggedin": false']
    llm_proxy:
      protocol: anthropic
      base_url_env: ANTHROPIC_BASE_URL
      upstream_base_url: https://api.anthropic.com
    # `preclass` is required when pre_classifier.enabled: a tool-safe evaluator mode.
    mode_map: { auto: bypassPermissions, approve: default, chat: plan, preclass: plan }
    # lineage: anthropic  # company tag (default: agent name). Cross-lineage
    #                     # review compares this — two agents on the same vendor
    #                     # should share a lineage so one never reviews the other.
    # Larger plan on claude: prefer it over codex when candidates are
    # otherwise comparable (small additive utility bonus). This is the STATIC
    # base — `availability_preference` (below) also folds candidate-specific
    # free plan headroom into effective cost, scales this bonus by that
    # headroom, and applies a penalty while the seat burns paid overage.
    preference: 0.1
    # `id` is the value passed to the CLI's `--model`; `api_model` is what the
    # provider's HTTP API calls the same model. They DIFFER here — `sonnet` and
    # `opus[1m]` are CLI aliases, not model ids — so `api_model` is required for
    # the per-request proxy: rewriting the request body's `model` to a CLI alias
    # gets a 404 from api.anthropic.com. Values below verified against the ids
    # claude-agent-acp actually puts on the wire for each alias.
    # Cache rates are load-bearing, not decoration: without them
    # `cache_reprime_break_even` returns 0 and the cache-aware demotion gate is
    # inert, leaving `minimum_dwell_requests` as the only (blunt) thrash guard.
    # Anthropic's rates are a fixed ratio of the input rate — read 0.1x,
    # write 1.25x — so a mid-session switch forfeits the warm cache and re-primes
    # at the target's write rate. At a 200k context that is ~$0.75 on Sonnet vs
    # ~$0.06 for a warm read, i.e. one switch costs ~12 warm turns. Those numbers
    # are what make the break-even the correct hysteresis.
    models:
      - { id: haiku, display_name: Claude Haiku, cost_rank: 1,
          api_model: claude-haiku-4-5,
          pricing: { input_per_mtok: 1.00, output_per_mtok: 5.00,
                     cache_read_per_mtok: 0.10, cache_write_per_mtok: 1.25 } }
      - { id: sonnet, display_name: Claude Sonnet, cost_rank: 2,
          api_model: claude-sonnet-5,
          pricing: { input_per_mtok: 3.00, output_per_mtok: 15.00,
                     cache_read_per_mtok: 0.30, cache_write_per_mtok: 3.75 } }
      # Claude Opus 5 — API id `claude-opus-5` (not 4.8). Same list price as
      # 4.8 ($5/$25, cache 0.1×/1.25× of input). CLI alias remains `opus[1m]`
      # (1M context is the only Opus 5 window).
      - { id: "opus[1m]", display_name: Claude Opus 5 1M, cost_rank: 4,
          api_model: claude-opus-5,
          pricing: { input_per_mtok: 5.00, output_per_mtok: 25.00,
                     cache_read_per_mtok: 0.50, cache_write_per_mtok: 6.25 } }
      - { id: "claude-fable-5[1m]", display_name: Claude Fable 5 1M, cost_rank: 5,
          api_model: claude-fable-5,
          pricing: { input_per_mtok: 10.00, output_per_mtok: 50.00,
                     cache_read_per_mtok: 1.00, cache_write_per_mtok: 12.50 } }

  - name: codex
    command:
      type: stdio
      command: ~/nvm/versions/node/v24.16.0/bin/codex-acp
    model_selection: { type: config-option }
    budget_prompts_5h: 400
    # Proactive cordons from Codex's own on-disk rate-limit snapshot (last-known,
    # since Codex has no pollable usage endpoint; reactive cordon backstops it).
    usage_source: { type: codex-rollout }
    # Logged out prints `Not logged in`, which the default patterns already
    # cover; logged in prints `Logged in using ChatGPT` and exits zero.
    auth_probe: { command: codex, args: ["login", "status"] }
    llm_proxy:
      protocol: openai
      base_url_env: OPENAI_BASE_URL
      upstream_base_url: https://chatgpt.com/backend-api/codex
      # ChatGPT OAuth prefers a WebSocket that ignores OPENAI_BASE_URL.
      # Install router-acp as an HTTP Responses provider so Sol requests can
      # demote within Codex to compatible Terra/Luna/etc.
      codex_chatgpt_provider: true
    mode_map: { auto: agent-full-access, approve: agent, chat: read-only, preclass: read-only }
    # `pricing` (USD per Mtok, published API rates as of 2026-07) prices
    # provider requests and synthesizes turn cost when an adapter reports none.
    # Without it every codex session records $0 and comparisons are blind.
    models:
      - { id: gpt-5.4-mini, display_name: GPT-5.4 Mini, cost_rank: 1,
          pricing: { input_per_mtok: 0.75, output_per_mtok: 4.50 } }
      - { id: gpt-5.5, display_name: GPT-5.5, cost_rank: 3,
          pricing: { input_per_mtok: 5.00, output_per_mtok: 30.00 } }
      - { id: gpt-5.6-luna, display_name: GPT Luna, cost_rank: 2,
          pricing: { input_per_mtok: 1.00, output_per_mtok: 6.00 } }
      - { id: gpt-5.6-terra, display_name: GPT Terra, cost_rank: 4,
          pricing: { input_per_mtok: 2.50, output_per_mtok: 15.00 } }
      - { id: gpt-5.6-sol, display_name: GPT Sol, cost_rank: 5,
          pricing: { input_per_mtok: 5.00, output_per_mtok: 30.00 } }

  # xAI Grok. The official CLI (`npm i -g @xai-official/grok`) is itself an ACP
  # agent — `grok agent stdio` — so no separate adapter is needed. Its own
  # company, so it's a valid cross-lineage reviewer for claude AND codex.
  # Auth is separate: run `grok login` once, then `grok models` to confirm the
  # exact model ids your plan exposes (router-acp drops unknown ids at startup).
  # No `usage_source`: Grok exposes no usage meter, so the router instead watches
  # Grok's own subscription access gate and cordons it automatically when you're
  # over your plan limit (governed by the `cordon:` block below).
  - name: grok
    command:
      type: stdio
      command: grok               # or an absolute path if not on the router's PATH
      args: ["agent"]             # + template below → `grok agent --model <id> stdio`
    lineage: xai
    budget_prompts_5h: 400
    # `grok models` exits zero either way, so the text is the only signal:
    # logged out says `You are not authenticated.`
    auth_probe:
      command: grok
      args: ["models"]
      unauthenticated_patterns: ["not authenticated"]
    llm_proxy:
      protocol: openai
      base_url_env: GROK_CLI_CHAT_PROXY_BASE_URL
      upstream_base_url: https://cli-chat-proxy.grok.com/v1
    model_selection:
      type: spawn-config          # grok fixes the model per process via --model
      process_template:
        args: ["--model", "${model_id}", "stdio"]
    models:
      - { id: grok-4.6, display_name: Grok 4.6, cost_rank: 5,    # current frontier
          pricing: { input_per_mtok: 2.00, output_per_mtok: 6.00,
                     cache_read_per_mtok: 0.50 } }
      # - { id: grok-code-fast-1, display_name: Grok Code Fast, cost_rank: 2 }
      # discovered 2026-08-26: enable once it has benchmark evidence, a score, and a
      # cost_rank you believe (`grok-4.5`).
      # - { id: grok-4.5, display_name: Grok 4.5, cost_rank: 1 }

  # Moonshot Kimi. The CLI (`uv tool install kimi-cli`, executable `kimi`) is
  # itself an ACP agent — `kimi acp` — so no separate adapter is needed. Its own
  # company, so it's a valid cross-lineage reviewer for claude, codex AND grok.
  # Auth is separate: run `kimi login` once (browser OAuth) — it also
  # auto-configures the model ids your account exposes; confirm them (config
  # file / `/model`) and list them below. No `usage_source` (Moonshot exposes no
  # pollable usage endpoint) → the reactive cordon covers it.
  - name: kimi
    command:
      type: stdio
      command: kimi               # or an absolute path if not on the router's PATH
    lineage: moonshot
    budget_prompts_5h: 400
    llm_proxy:
      protocol: openai
      base_url_env: KIMI_BASE_URL
      upstream_base_url: https://api.kimi.com/coding/v1
    model_selection:
      type: spawn-config          # kimi fixes the model per process via --model,
      process_template:           # which is a GLOBAL flag → it precedes `acp`
        args: ["--model", "${model_id}", "acp"]
    models:
      - { id: kimi-k2, display_name: Kimi K2, cost_rank: 2,
          pricing: { input_per_mtok: 0.55, output_per_mtok: 2.20 } }
      # - { id: kimi-k2-thinking, display_name: Kimi K2 Thinking, cost_rank: 3 }

router: auto
routers:
  escalation:
    initial_router: auto
    escalation_path: ladder            # ladder | leap
    escalate_before_side_effects: true # mid-turn default; false = post-turn only
    min_start_score: 0.0               # optional floor on the starting model
    escalate_after_reads: 6            # mid-turn read-volume trigger (0 = off)
    escalate_after_tool_calls: 30      # mid-turn "grinding" trigger: escalate once
                                       # one turn issues this many tool calls without
                                       # finishing (robust to Bash/edit-heavy work; 0 = off)
    escalate_after_tool_failures: 3    # mid-turn churn trigger (0 = off)
    escalate_on_max_tokens: true
    escalate_on_refusal: true
    max_escalations: 3

  auto:
    # 0 = pure quality, 10 = cheapest survivor. Seats are flat-rate, so lean
    # quality: trivial prompts still go cheap because the tradeoff scales
    # down with classified complexity (complexity_scales_tradeoff, on by
    # default) — hard prompts get frontier models. NOTE: this is a GLOBAL
    # cost/quality knob — raising it skews toward candidates with more free
    # plan headroom and lower scarcity ranks. Quality differences come only
    # from the benchmark calibration in data/model-policy.yaml.
    cost_quality_tradeoff: 3
    # Floor on the effective cost weight after complexity scaling. Without
    # it, a complexity-1.0 classification zeroes the cost term entirely and
    # routing becomes pure quality-max — observed as 96% of delegate spend
    # landing on the top-rank model. 0 disables (legacy behavior).
    min_cost_weight: 0.15
    # At/above this classified complexity, ranking bypasses cost entirely
    # (pure quality, tradeoff forced to 0) — the break-glass path that lets a
    # score-table compression pair's preferred member (see
    # `data/model-policy.yaml`'s `benchmark_scoring.compression`) win `auto`
    # itself at genuine extremes, not only via explicit pins/planner globs.
    apex_complexity: 0.9

# Proactive usage-cap cordoning (on by default; inert unless an agent declares a
# `usage_source` above). Polls the provider usage API and marks a model
# unroutable while its cap is exhausted with no overage/credit headroom — so
# auto/failover skip it, an explicit pin to it falls back, and a client's model
# picker can show it disabled. Generic (models discovered from the API) and
# fail-open (a usage-endpoint hiccup never makes a model unroutable).
cordon:
  enabled: true
  poll_secs: 300

# Plan-aware effective cost (on by default). A candidate's quota term uses the
# lower of local sliding-window headroom and its seat budget. Seats are
# compared in real DOLLARS, not the fraction of each provider's own cap — a
# $9k pool at 3% free and a $3k pool at 3% free are the same percentage but
# not the same seat. Overage/credit pools report real dollars straight from
# the provider API; included-plan windows have no dollar field on either
# provider, so the router estimates them from its own metered spend vs the
# window's percent (falls back to the percent fraction when the estimate
# lacks signal). The static `agents[].preference` bonus fades the same way,
# and a seat past its cap but still routable via overage/credits pays a
# difficulty-scaled `cost_aversion × (1 - complexity)` surcharge. Model-scoped
# windows (including Claude Fable's separate weekly cap) affect only matching
# models. Availability comes from the same usage polls as `cordon` plus
# optional client hints (the `router-acp/availability_hint` extension
# notification; e.g. Kory Code pushes its own per-minute seat-usage view,
# optionally with real dollar amounts). A fresh hint outranks the poll for
# `hint_ttl_secs`, then the poll rules again.
availability_preference:
  enabled: true
  cost_aversion: 0.1           # 0 = happy to pay; higher raises the difficulty bar
  hint_ttl_secs: 600           # how long a client hint stays authoritative
  headroom_scale_dollars: 200  # remaining budget at/above which a seat reads fully free

orchestration:
  enabled: true
  min_items: 2                              # smallest list treated as multi-part
  # Opus 5 outranks Grok 4.6 on quality (see data/scores.yaml); keep Fable /
  # Sol first as absolute frontiers, then Opus, then Grok as cross-lineage.
  planner: ["*fable*", "*sol*", "*opus*", "*grok-4.6*"] # best first
  reviewer: ["*sol*", "*opus*", "*fable*", "*grok-4.6*"] # different lineage preferred
  submit: branch                            # never | branch | pr | merge
  max_fix_rounds: 2
  review_confidence: 0.8                    # planner confidence above this skips the review

# Composable LLM pre-classifier: one cheap ACP evaluation authoritatively
# decides task class, complexity, auto-orchestration, and host dimensions.
# When disabled or invalid, routing falls back to the static classifier and
# orchestration falls back to tasklist::detect_task_list.
# Hosts (e.g. Kory Code) register extra dimensions under `dimensions:`.
# Hickory boxes load defaults from kory-code/router.yaml, not this example.
pre_classifier:
  enabled: false                            # opt in; Hickory enables in monorepo yaml
  evaluator: ["*haiku*", "*mini*", "*flash*"]
  timeout_ms: 15000                         # prompt-turn budget only (spawn + session/new excluded)
  disclose: true
  orchestrate_min_confidence: 0.65
  dimensions: []
  # Example host dimension (Kory Code registers ui_planning in monorepo yaml):
  # dimensions:
  #   - id: ui_planning
  #     description: |
  #       Is this a non-trivial UI-bearing request that should enter mockup-first
  #       planning? mode is one of: planning | trivial-bypass | execution.
  #     min_confidence: 0.70
  #     act_when: { field: mode, equals: planning }
  #     inject_prompt: |
  #       [host guidance text…]

# Demotion — the counterpart of escalation/auto-upgrade. An ELEVATED pin (one
# the router raised for an escalation, an auto-upgrade, or a skill_routing
# rule — never an explicit user pick) expires after this many consecutive
# quiet turns (no tool failures, token-ceiling hits, or refusals), and the
# session steps back down to the strongest cheaper candidate. Without it, one
# hard patch — or one `/ship-pr` turn — pins a long session (e.g. a ship
# watcher's CI-poll loop) to frontier pricing for every routine turn that
# follows. Re-escalation on fresh difficulty still applies.
demotion:
  after_quiet_turns: 3

# Mid-session model switching. A pinned session can move to a more capable
# model on its own when its confidence drops. Confidence = the pinned model's
# quality for the task class minus accumulated "struggle" (token-ceiling hits,
# refusals, repeated tool failures). Explicit `[router: switch=agent/model]`
# always works regardless of this setting.
auto_upgrade:
  enabled: true                 # false disables automatic upgrades entirely
  confidence_threshold: 0.55    # upgrade below this; higher = more eager

# Ticket context (pluggable). When a prompt mentions <prefix><digits> (e.g.
# "Fix HAI-1234"), the router runs `command` ($TICKET substituted) and prepends
# its stdout to the prompt BEFORE classification and orchestration detection —
# so a bare ticket reference routes (and, if the ticket is a work list,
# orchestrates) on the ticket's real content, and the planner can delegate its
# parts. Works with any ticketing system whose CLI can print an issue; the
# command runs without a shell and fails open (a bad fetch never blocks the
# turn). Each ticket is injected once per session.
ticket_context:
  - prefix: "HAI-"                                    # Linear (CLI keychain auth)
    command: ["linear", "issue", "view", "$TICKET"]   # use an absolute path if
                                                      # `linear` isn't on the
                                                      # router's PATH
  # - prefix: "PROJ-"                                 # Jira
  #   command: ["jira", "issue", "view", "$TICKET", "--plain"]
  # - prefix: "GH-"                                   # GitHub (GH-123 → issue 123;
  #   command: ["/bin/sh", "-c", "gh issue view \"${1#GH-}\"", "sh", "$TICKET"]

# Force skills onto a class of models. When a prompt invokes `pattern`
# (as `/name` or a standalone token) and the pinned model isn't already in
# `candidates`, the session switches to the best available match (summarize +
# re-pin). Candidates are candidate globs in preference order.
skill_routing:
  - pattern: ship-pr
    # Opus 5 > Grok 4.6 on quality; prefer Opus when the Claude seat is free.
    candidates: ["*opus*", "*grok*", "*gpt-5.5*"]
