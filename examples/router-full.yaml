# Example router-acp configuration: Claude + Codex seat adapters.
#
# Copy, adjust the model ids to what your adapters actually expose, and run:
#   router-acp check-config --config router.yaml
#   router-acp serve --config router.yaml

router: auto                    # auto | pareto-code | escalation | static
# SQLite state DB. The `sessions` table records the title and full routing
# decision (router, weights, task class/complexity, skipped candidates) plus
# parent links for delegated sub-agents and token counters; `session_log`
# captures every ACP interaction with token usage. Inspect with
# `router-acp sessions --config <file>`.
state_file: ~/.local/state/router-acp/sessions.db
# Keep sessions (and their logs) this long, then auto-prune. Duration string:
# 30d / 12h / 90m / 3600s, or a bare number of days.
history: 30d

classifier:
  backend: heuristic            # heuristic | local-model
  local_model: null             # e.g. ollama:qwen3:4b; optional
  timeout_ms: 1500

delegation:
  enabled: true
  # Opt in to a one-shot, scoped delegation directive, but only on ordinary
  # sessions where the router actually attached a cheaper-worker tool.
  inject_prompt: false
  # The host defines catalog names and opaque capabilities. Its classifier
  # extension decides when they are required; the router owns neither meanings
  # nor credentials.
  mcp_catalogs: []
  # A client that spawns router-acp but never holds a live post-`session/new`
  # connection into the session it created (e.g. a recipe runner relaying only
  # stdout) can never send `router-acp/delegate_mcp_catalogs`. Such a host sets
  # the ROUTER_ACP_MCP_CATALOGS env var instead, with the same JSON shape as
  # that notification's `catalogs` param, before starting the router process.
  max_concurrent: 3

# Graceful degradation. Rate/usage-limited agents are cordoned until the
# reset time parsed from the model's error (or cordon_default_secs when the
# model reported none); outages fail over to the next best candidate with a
# visible notice and dead adapters are respawned automatically.
headroom:
  cordon_default_secs: 900
failover:
  enabled: true
  respawn_cooldown_secs: 30
  max_attempts: 3

# Per-LLM-request routing. When enabled, router-acp binds one loopback HTTP
# listener and injects each configured adapter's base-URL override. It keeps
# auth and request/response bodies intact except for the top-level `model`,
# streams responses, starts from the ACP-pinned model, demotes after a routine
# streak, and immediately escalates on failures/stagnation/token ceilings.
# Keep disabled until `api_model` values and upstream OAuth/API endpoints have
# been verified for your installed adapters.
llm_proxy:
  enabled: true
  listen: 127.0.0.1:0
  routine_streak: 3            # consecutive routine tool-result turns before demoting
  # Anthropic prompt caching is per-model, so a mid-session demotion re-primes
  # the whole prefix on the cheaper model at its cache-WRITE rate (a one-time
  # cost). The router won't demote until the routine streak also clears the
  # per-pair break-even (⌈(target_write−pinned_read)/(pinned_read−target_read)⌉;
  # below it you'll see `cache-hold` rows). On the fable DEFAULT (Fable 5, read
  # $1.00) that is Fable→Sonnet = 2 turns and Fable→Opus = 11. Pin a session to
  # Fable 5.1 and the arithmetic changes sharply: its read is $0.25/Mtok
  # (0.025x input, against 0.1x everywhere else), so Fable→Sonnet stretches to
  # 46 turns and Fable→Opus saves nothing on reads at all ($0.50 > $0.25) —
  # the gate reports break-even 0 there, so cache economics stop holding that
  # pair and `minimum_dwell_requests` is the only damper left. Keep
  # minimum_dwell_requests at/above the break-even you actually want enforced.
  minimum_dwell_requests: 12
  verdict_ttl_requests: 6
  verdict_ttl_secs: 900
  context_window_fraction: 0.9

# Proactive usage-cap cordoning. On top of the reactive (error-driven) cordons
# above, poll each agent's provider usage API and mark a candidate unroutable
# BEFORE it's tried when its cap is exhausted with no overage/credit headroom.
# Generic: which models are exhausted is read from the API, never hardcoded.
# Enable per-agent with `usage_source` (see the claude agent below). Cordoned
# candidates are excluded from auto, skipped by failover, refused (with a
# fallback) on an explicit pin, and advertised to the client as unavailable.
cordon:
  enabled: true          # default true (inert unless an agent has a usage_source)
  poll_secs: 300         # usage poll interval / cache TTL (~5 min)

# Mid-session model switching. A pinned session can move to a more capable
# model on its own when its confidence drops. Confidence = the fraction of
# classified capability demand met by benchmark quality minus accumulated
# "struggle" (token-ceiling hits, refusals, repeated tool failures). Explicit
# `[router: switch=agent/model]` always works regardless of this setting.
auto_upgrade:
  enabled: true                 # false disables automatic upgrades entirely
  confidence_threshold: 0.55    # upgrade below this; higher = more eager

# Ticket context (pluggable): load referenced tickets into the prompt before
# routing. Any prefix + any command that prints the ticket ($TICKET
# substituted, run without a shell); fails open; once per session per ticket.
ticket_context:
  - prefix: "HAI-"
    command: ["linear", "issue", "view", "$TICKET"]

# Force skills onto a class of models. When a prompt invokes `pattern`
# (as `/name` or a standalone token) and the pinned model isn't already
# acceptable, the session switches to the best available match (summarize +
# re-pin). Candidates are candidate globs in preference order.
#
# `candidates` is the switch-TARGET pool. `also_acceptable` (optional) names
# pins that are fine to stay on but must never be switched to — use it for
# models already good enough for the skill that you don't want to route to,
# typically the expensive top of the range. Without it, the only way to stop
# force-switching a good pin is to widen the target pool, which sends every
# genuine switch to the most expensive entry.
skill_routing:
  - pattern: ship-pr
    candidates: ["*opus*", "*gpt-5.5*"]
    also_acceptable: ["*fable*", "*sol*"]

# Version pinning. Hold a family's traffic on a specific released version while
# its default alias moves on. Whenever candidate resolution lands on a KEY —
# the strategy's winner, an explicit `[router: candidate=…]`/`switch=` naming
# the key, a skill route, `routers.static.candidate` — the session pins to the
# TARGET instead, and the routing disclosure names the target so the user is
# told which model actually served the turn.
#
# One hop only (a target that is itself a key is not followed). Both sides must
# be declared models of the SAME agent — the substitution swaps the model, not
# the seat — and the load fails with a clear message otherwise. Naming the
# target directly is unaffected. The target is normally an
# `auto_eligible: false` pin-only entry (see the claude models below), which is
# what makes a specific version reachable on purpose and never by accident.
#
# The example below is the second way to flip a family's default: rather than
# editing the entries, point the default's id at the pin-only version. Useful
# for a reversible rollout — one line in, one line out.
# model_version_pins:
#   "claude/claude-fable-5[1m]": "claude/claude-fable-5-1"

# Auto-orchestration of multi-part task lists. When a prompt reads as a list
# (markdown bullets/numbers, inline "(1)(2)", or "first… then… finally…") the
# router runs a plan→delegate→review pipeline entirely in-process:
# it steers/switches the session onto a `planner` frontier model and injects an
# orchestration protocol telling that model to decompose the task, delegate the
# independent parts IN PARALLEL via `delegate_task background: true` +
# `delegate_await` (each routed per-complexity in its own sub-session), have a
# DIFFERENT-lineage `reviewer` verify the net result — skipped with a note when
# no other lineage is routeable or the planner's stated confidence exceeds
# `review_confidence` — and adjudicate fixes. Orchestrating sessions may delegate to same-/higher-
# tier peers (so the cross-lineage review is routeable), and the planner can
# hold a sub-agent open across review→fix rounds (keep_open + delegate_followup).
# An explicit `[router: …]` directive or `model:` shorthand suppresses it.
# Disabled by default — turn it on here.
orchestration:
  enabled: true
  min_items: 2                              # smallest list treated as multi-part
  planner: ["*fable*", "*sol*", "*grok*"] # best first
  reviewer: ["*sol*", "*fable*", "*grok*"] # a different lineage will be preferred
  instructions: ""                         # optional opaque host-owned workflow policy
  max_fix_rounds: 2
  review_confidence: 0.8                    # planner confidence above this skips the review

agents:
  - name: claude
    command:
      type: stdio
      command: npx
      args: ["-y", "@agentclientprotocol/claude-agent-acp"]
      env: []
    model_selection:
      type: config-option       # discover the category:model config option,
                                # then session/set_config_option per session
    budget_prompts_5h: 400
    usage_source:               # proactive cordons from the Anthropic usage API
      type: anthropic-oauth     # (reads the CLI OAuth token; see `cordon` above)
    auth_probe:                 # a logged-out Claude still advertises every
      command: claude           # model, so ask the CLI instead of trusting the
      args: ["auth", "status"]  # advertisement. Unreadable output = fail open.
      timeout_ms: 3000
      unauthenticated_patterns: ['"loggedin": false']
    llm_proxy:
      protocol: anthropic
      base_url_env: ANTHROPIC_BASE_URL
      upstream_base_url: https://api.anthropic.com
    # `preclass` is required when pre_classifier.enabled: a tool-safe evaluator mode.
    mode_map: { auto: bypassPermissions, approve: default, chat: plan, preclass: plan }
    preference: 0.1             # static tie-break; client/provider plan
                                # headroom makes scarce seats costlier
    models:
      # ids must exactly match the downstream model selector's values;
      # run with RUST_LOG=router_acp=debug to see what the adapter offers.
      # `api_model` is what the proxy writes into the /v1/messages body when it
      # demotes — it must be a real Anthropic model id (the ACP `id` above is
      # only a selector alias). These three are verified valid on the Claude
      # Code subscription OAuth endpoint. Include cache_read/cache_write pricing:
      # on the Anthropic wire a mid-session demotion forfeits the per-model
      # prompt cache and re-primes the prefix at cache_write on the switch turn,
      # so accurate cache pricing is what keeps session-wide savings honest.
      - id: sonnet
        display_name: Claude Sonnet
        api_model: claude-sonnet-5
        cost_rank: 2            # 1 = cheapest/least scarce
        # Permanently $2/$10: the 2026-09-01 increase to $3/$15 was cancelled.
        pricing: { input_per_mtok: 2.00, output_per_mtok: 10.00, cache_read_per_mtok: 0.20, cache_write_per_mtok: 2.50 }
      - id: opus
        display_name: Claude Opus 5
        api_model: claude-opus-5
        cost_rank: 3
        pricing: { input_per_mtok: 5.00, output_per_mtok: 25.00, cache_read_per_mtok: 0.50, cache_write_per_mtok: 6.25 }
      # The fable DEFAULT serves Fable 5, deliberately not 5.1: the wire id
      # `claude-fable-5-1` is gated server-side on Claude Code >= 2.1.251, so
      # defaulting to it would 400 every fable-routed request (auto, planner
      # globs, apex complexity) on any older CLI.
      - id: "claude-fable-5[1m]"
        display_name: Claude Fable 5 1M
        api_model: claude-fable-5
        cost_rank: 4
        pricing: { input_per_mtok: 10.00, output_per_mtok: 50.00, cache_read_per_mtok: 1.00, cache_write_per_mtok: 12.50 }
      # Claude Fable 5.1 — a PIN-ONLY version. `auto_eligible: false` removes it
      # from every automatic pool (strategies, escalation/demotion, pre-class
      # evaluators, planner/reviewer globs, skill routes, failover, delegation,
      # per-request proxy routing) while it stays listed in the model picker,
      # selectable by name, and valid as a `model_version_pins` target.
      # `downstream_id` is required whenever `id` is a bare API model id the
      # selector does not advertise: without it the probe drops the candidate
      # as "not offered by downstream model selector". The alias opens the
      # session; `api_model` decides what goes on the wire.
      # Its cache READ is 0.025x input ($0.25) rather than the usual 0.1x, so
      # state the rate — do not derive it.
      # ONE-LINE DEFAULT FLIP once your CLI clears the floor: move
      # `api_model: claude-fable-5-1` (and the 0.25 read) onto the entry above.
      - id: claude-fable-5-1
        display_name: Claude Fable 5.1 1M
        auto_eligible: false
        downstream_id: "claude-fable-5[1m]"
        api_model: claude-fable-5-1
        cost_rank: 4
        pricing: { input_per_mtok: 10.00, output_per_mtok: 50.00, cache_read_per_mtok: 0.25, cache_write_per_mtok: 12.50 }

  - name: codex
    command:
      type: stdio
      command: npx
      # Use @agentclientprotocol/codex-acp (>= 1.1.2). It drives your installed
      # `codex` CLI, so its model selector lists whatever your codex offers,
      # including the newer gpt-5.6-* models. (The older @zed-industries build
      # bundled a stale Codex core that couldn't run them.)
      args: ["-y", "@agentclientprotocol/codex-acp"]
      env: []
    # config-option: discover codex-acp's model selector and set per session.
    model_selection: { type: config-option }
    budget_prompts_5h: 400
    usage_source:               # proactive cordons from Codex's on-disk snapshot
      type: codex-rollout       # (no pollable endpoint; last-known + reactive backstop)
    auth_probe:                 # `Not logged in` matches the default patterns
      command: codex
      args: ["login", "status"]
    # ChatGPT OAuth endpoint. For API-key auth use
    # `upstream_base_url: https://api.openai.com/v1`.
    llm_proxy:
      protocol: openai
      base_url_env: OPENAI_BASE_URL
      upstream_base_url: https://chatgpt.com/backend-api/codex
      codex_chatgpt_provider: true
    mode_map: { auto: agent-full-access, approve: agent, chat: read-only, preclass: read-only }
    models:
      - { id: gpt-5.4-mini, display_name: GPT-5.4 Mini, cost_rank: 1 }
      - { id: gpt-5.5, display_name: GPT-5.5, cost_rank: 3 }
      # Newer "sol / terra / luna" lines, scored via `*sol*`/`*terra*`/`*luna*`
      # in data/scores.yaml (sol = frontier, terra = strong, luna = small).
      # Available whenever your codex CLI + codex-acp expose them.
      - { id: gpt-5.6-luna, display_name: GPT Luna, cost_rank: 2 }
      - { id: gpt-5.6-terra, display_name: GPT Terra, cost_rank: 4 }
      - { id: gpt-5.6-sol, display_name: GPT Sol, cost_rank: 5 }

  # xAI Grok — the official CLI (`@xai-official/grok`) is itself an ACP agent
  # (`grok agent stdio`); no separate adapter needed. Own company/lineage, so it
  # can review (and be reviewed by) claude and codex. `grok login` is separate.
  # No `usage_source`: Grok has no usage meter, so the router auto-cordons it off
  # its own subscription access gate when you're over your plan (via `cordon:`).
  - name: grok
    command:
      type: stdio
      command: grok
      args: ["agent"]
    lineage: xai
    budget_prompts_5h: 400
    # `grok models` exits zero either way, so the text is the only signal:
    # logged out says `You are not authenticated.`
    auth_probe:
      command: grok
      args: ["models"]
      unauthenticated_patterns: ["not authenticated"]
    # Browser-login/OAuth endpoint. With XAI_API_KEY use GROK_MODELS_BASE_URL
    # and https://api.x.ai/v1 instead.
    llm_proxy:
      protocol: openai
      base_url_env: GROK_CLI_CHAT_PROXY_BASE_URL
      upstream_base_url: https://cli-chat-proxy.grok.com/v1
    model_selection:
      type: spawn-config              # model fixed per process via --model
      process_template:
        args: ["--model", "${model_id}", "stdio"]
    models:
      - { id: grok-4.6, display_name: Grok 4.6, cost_rank: 5 }
      # confirm ids with `grok models` after login; router-acp drops unknown ids

  # Moonshot Kimi — the CLI (`uv tool install kimi-cli`) is itself an ACP agent
  # (`kimi acp`); no separate adapter needed. Own company/lineage, so it can
  # review (and be reviewed by) claude, codex and grok. `kimi login` is separate
  # (browser OAuth) and auto-configures your account's model ids. `--model` is a
  # global flag, so it precedes the `acp` subcommand. No `usage_source` (no
  # pollable Moonshot usage endpoint) → reactive cordon only.
  - name: kimi
    command:
      type: stdio
      command: kimi
    lineage: moonshot
    budget_prompts_5h: 400
    llm_proxy:
      protocol: openai
      base_url_env: KIMI_BASE_URL
      upstream_base_url: https://api.kimi.com/coding/v1
    model_selection:
      type: spawn-config              # model fixed per process via --model
      process_template:
        args: ["--model", "${model_id}", "acp"]
    models:
      - { id: kimi-k2, display_name: Kimi K2, cost_rank: 2 }
      # - { id: kimi-k2-thinking, display_name: Kimi K2 Thinking, cost_rank: 3 }

routers:
  static:
    candidate: claude/sonnet
  auto:
    cost_quality_tradeoff: 7    # 0 = pure quality, 10 = cheapest survivor
    complexity_floor: 0.7
    allowed_candidates: ["*"]
  pareto-code:
    min_coding_score: 0.66      # >= 0.66 high tier, >= 0.33 medium, else low
  escalation:
    # Start on the cheapest capable model; escalate only when observed
    # execution reveals hidden difficulty (not from guessing the prompt).
    escalation_path: ladder            # ladder (next tier up) | leap (strongest)
    # initial_router: auto             # delegate the STARTING pick to another
                                       # router instead of picking cheapest; escalation
                                       # still applies from there (auto|pareto-code|static)
    escalate_before_side_effects: true # mid-turn, while still investigating
    escalate_after_reads: 6            # reads before a side effect → escalate (0=off)
    escalate_after_tool_calls: 30      # total tool calls in one turn without finishing
                                       # → escalate (the robust "grinding" signal; 0=off)
    escalate_after_tool_failures: 3    # tool-failure churn → escalate mid-turn (0=off)
    escalate_on_max_tokens: true
    escalate_on_refusal: true
    min_start_score: 0.0               # optional floor on the starting model
    max_escalations: 3
